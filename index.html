<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nick Schurr</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Nick Schurr</h1>
    <p class="subtitle">PhD Student, Interactive Robotics Group</p>

    <div id="flower-wrap">
      <svg id="flower-svg" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <!-- Stem -->
        <path class="stem" d="M110,250 C100,190 120,150 110,90" />

        <!-- Leaves -->
        <ellipse class="leaf" cx="85" cy="190" rx="18" ry="9" transform="rotate(-30 85 190)" />
        <ellipse class="leaf" cx="135" cy="210" rx="18" ry="9" transform="rotate(30 135 210)" />

        <!-- Petals (6 around center at 110,90) -->
        <ellipse class="petal" fill="#ff6f91" cx="110" cy="60" rx="14" ry="26" />
        <ellipse class="petal" fill="#ff9671" cx="110" cy="60" rx="14" ry="26" transform="rotate(60 110 90)" />
        <ellipse class="petal" fill="#ffc75f" cx="110" cy="60" rx="14" ry="26" transform="rotate(120 110 90)" />
        <ellipse class="petal" fill="#845ec2" cx="110" cy="60" rx="14" ry="26" transform="rotate(180 110 90)" />
        <ellipse class="petal" fill="#00c9a7" cx="110" cy="60" rx="14" ry="26" transform="rotate(240 110 90)" />
        <ellipse class="petal" fill="#d65db1" cx="110" cy="60" rx="14" ry="26" transform="rotate(300 110 90)" />

        <!-- Center -->
        <circle class="center" cx="110" cy="90" r="14" fill="#ffe066" />
      </svg>
    </div>
    <p class="hint">(click a petal to change its color)</p>

    <div class="nav-buttons">
      <a href="about.html">About Me</a>
      <a href="project.html">Project</a>
    </div>

  <script src="script.js"></script>

</html>
